<!DOCTYPE html>

<body class="page-doc">
  <main class="container update-page">
    <h1>更新 AI 热点</h1>
    <p>点击后由 GitHub Actions 从中文 RSS 资讯源实时采集，完成后自动更新最新数据并归档历史数据。</p>

    <label class="update-label" for="github-token">GitHub Token（仅本次使用，不会保存）</label>
    <input class="update-input" id="github-token" type="password" autocomplete="off" placeholder="需要 Actions: Read and write 权限">

    <button type="button" class="ai-hot-collect" data-update-start>采集并更新</button>
    <p class="update-status" data-update-status aria-live="polite">等待开始。</p>

    <nav class="doc-nav" aria-label="页面导航">

  </main>

  <footer class="site-footer">

  </footer>

  <script src="assets/js/update.js"></script>
