name: Update AI hot data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,9 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate latest AI hot data
        run: python scripts/update_ai_hot.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ai-hot-latest.js assets/data/ai-hot-history.js
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update AI hot data"
            git push
          fi